[project]
name            = "kicad-mcp-server"
version         = "2.1.0"
description     = "Pure Python MCP server for KiCad PCB design automation (full parity with mixelpixx/KiCAD-MCP-Server)"
readme          = "README.md"
requires-python = ">=3.10"
license         = {text = "MIT"}
authors         = [{name = "Miroslav Talasek", email = "miroslav.talasek@gmail.com"}]

dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "sexpdata>=1.0.0",
    "pillow>=10.0.0",
    "colorlog>=6.7.0",
    "python-dotenv>=1.0.0",
    "kicad-python>=0.7.0",
    "kicad-skip>=0.2.5",
]

[project.optional-dependencies]
ipc  = ["kicad-python>=0.7.0"]
svg  = ["cairosvg>=2.7.0"]
skip = ["kicad-skip>=0.2.5"]
dev  = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "black>=23",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
kicad-mcp = "kicad_mcp.__main__:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kicad_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.black]
line-length    = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version        = "3.10"
warn_return_any       = false
warn_unused_configs   = true
check_untyped_defs    = false
disallow_untyped_defs = false
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pcbnew",
    "cairosvg",
    "sexpdata",
    "skip",
    "kipy",
    "kipy.*",
    "PIL",
    "PIL.*",
]
ignore_missing_imports = true
